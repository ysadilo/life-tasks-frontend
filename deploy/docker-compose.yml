# Raspberry Pi deployment: Caddy serving the built SPA + reverse-proxying /api
# to the backend, exposed at https://lifetasks.today via a Cloudflare Tunnel
# (outbound-only, no port forwarding, no public IP needed). Image built on the Pi.
#   docker network create life-tasks   # once (also created by the backend deploy)
name: life-tasks-frontend

services:
  frontend:
    build:
      context: ..
      args:
        # from deploy/.env — baked into the bundle at build time
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:?set VITE_AUTH0_DOMAIN in .env}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:?set VITE_AUTH0_CLIENT_ID in .env}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:?set VITE_AUTH0_AUDIENCE in .env}
    restart: unless-stopped
    networks: [life-tasks]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    networks: [life-tasks]

networks:
  life-tasks:
    external: true
